<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>真香桌游·阿瓦隆</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body { font-family: sans-serif; }

/* 页面切换 */
.page { display:none; }
.page.active { display:block; }

/* ================= 播报页（保持你原来的简化版） ================= */
#narratorPage {
    padding:20px;
}

.number-btn, .control-btn, .enter-game-btn {
    padding:10px 20px;
    margin:5px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

/* ================= 🎬 版图页（核心改造） ================= */
#gameBoardPage {
    position: fixed;
    inset: 0;
    background: #000;
    overflow: hidden;
}

/* 电影屏幕 */
.cinema-screen {
    position: absolute;
    top: 50%;
    left: 50%;

    width: 100vw;
    height: 56.25vw; /* 16:9 */

    max-height: 100vh;
    max-width: 177.78vh;

    transform: translate(-50%, -50%);
    transform-origin: center;

    background: url('images/board-bg.jpg') no-repeat center/cover;
    box-shadow: 0 0 40px rgba(0,0,0,0.9);
    overflow: hidden;
}

/* 📱 竖屏 → 自动旋转 */
@media (orientation: portrait) {
    .cinema-screen {
        width: 100vh;
        height: 56.25vh;
        transform: translate(-50%, -50%) rotate(90deg);
    }
}

/* 内容层 */
.board-content {
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

/* 返回按钮 */
.back-btn {
    position:absolute;
    top:10px;
    left:10px;
    z-index:10;
}

/* 任务 */
.task-icons-row {
    display:flex;
    width:100%;
    justify-content:space-evenly;
}

.task-icon {
    width:14%;
    aspect-ratio:1;
    border-radius:50%;
    background:#666;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:20px;
    cursor:pointer;
}

.task-icon.state-success { background:green; }
.task-icon.state-fail { background:red; }

</style>
</head>

<body>

<!-- 播报页 -->
<div id="narratorPage" class="page active">
    <button class="number-btn" onclick="startGame(5)">5人</button>
    <button class="number-btn" onclick="startGame(6)">6人</button>
    <button class="number-btn" onclick="startGame(7)">7人</button>

    <br><br>
    <button class="enter-game-btn" onclick="enterGame()">进入游戏</button>
</div>

<!-- 版图页 -->
<div id="gameBoardPage" class="page">
    <div class="cinema-screen">
        <button class="back-btn" onclick="back()">返回</button>

        <div class="board-content">
            <div class="task-icons-row" id="tasks"></div>
        </div>
    </div>
</div>

<script>

let currentPlayers = 5;
let taskStates = [0,0,0,0,0];

const taskMap = {
    5:[2,3,2,3,3],
    6:[2,3,4,3,4],
    7:[2,3,3,4,4]
};

function startGame(num){
    currentPlayers = num;
    alert("已选择 "+num+" 人局");
}

function enterGame(){
    document.getElementById("narratorPage").classList.remove("active");
    document.getElementById("gameBoardPage").classList.add("active");

    renderTasks();

    // ⭐ 横屏提示
    if (window.matchMedia("(orientation: portrait)").matches) {
        setTimeout(()=>{
            alert("📱 已自动进入横屏模式\n直接观看即可 🎬");
        },300);
    }
}

function back(){
    document.getElementById("gameBoardPage").classList.remove("active");
    document.getElementById("narratorPage").classList.add("active");
}

function renderTasks(){
    const container = document.getElementById("tasks");
    container.innerHTML = "";

    const nums = taskMap[currentPlayers];

    nums.forEach((n,i)=>{
        const div = document.createElement("div");
        div.className = "task-icon";
        div.innerText = n;

        if(taskStates[i]===1) div.classList.add("state-success");
        if(taskStates[i]===2) div.classList.add("state-fail");

        div.onclick = ()=>{
            taskStates[i] = (taskStates[i]+1)%3;
            renderTasks();
        };

        container.appendChild(div);
    });
}

</script>

</body>
</html>
