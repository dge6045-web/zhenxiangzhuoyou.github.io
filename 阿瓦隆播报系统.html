<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>阿瓦隆 · 真人语音播报系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: #1a252f; 
            color: #ecf0f1; 
            font-family: 'Segoe UI', '微软雅黑', system-ui, sans-serif; 
            padding: 16px; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .title { text-align: center; margin: 10px 0 20px; color: #3498db; font-size: 7vw; font-weight: 500; letter-spacing: 2px; }
        .container { max-width: 700px; margin: 0 auto; width: 100%; flex: 1; display: flex; flex-direction: column; }
        .number-select { text-align: center; margin-bottom: 25px; }
        .number-select p { font-size: 18px; margin-bottom: 12px; opacity: 0.9; }
        .number-btn { 
            padding: 16px 20px; margin: 6px; border: none; border-radius: 50px; 
            background-color: #2c3e50; color: white; font-size: 18px; font-weight: bold; 
            cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); min-width: 90px; 
            border: 1px solid #3d566e; transition: all 0.1s;
        }
        .number-btn.active { background-color: #27ae60; border-color: #2ecc71; transform: scale(0.97); }
        .number-btn:active { background-color: #1e2b38; }
        .control-area { text-align: center; margin-bottom: 20px; }
        .control-btn { 
            padding: 14px 18px; margin: 5px; border: none; border-radius: 40px; 
            background-color: #c0392b; color: white; font-size: 18px; font-weight: bold; 
            cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); min-width: 85px; 
            border: 1px solid #e74c3c; transition: all 0.1s;
        }
        .control-btn:active { background-color: #962d22; transform: scale(0.96); }
        .speed-control { margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
        .script-area { 
            background-color: #1e2b38; padding: 20px 16px; border-radius: 24px; 
            min-height: 320px; max-height: 50vh; overflow-y: auto; margin: 15px 0 20px; 
            border: 1px solid #3d566e; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .script-line { 
            margin: 18px 0; line-height: 1.6; font-size: 20px; padding: 8px 12px; 
            border-radius: 16px; transition: background 0.2s;
        }
        .script-line.current { 
            color: #f1c40f; font-weight: bold; background-color: #2c3e50; 
            border-left: 6px solid #f1c40f; padding-left: 18px;
        }
        .script-line.past { color: #7f8c8d; text-decoration: line-through 1px rgba(127,140,141,0.5); }
        .footer { text-align: center; color: #95a5a6; font-size: 15px; margin-top: auto; padding: 15px 0 5px; }
        .status-badge { 
            display: inline-block; background: #27ae60; color: white; padding: 6px 18px; 
            border-radius: 30px; font-size: 16px; margin-bottom: 12px;
        }
        .audio-status { margin-top: 10px; font-size: 14px; opacity: 0.9; min-height: 24px; }
        @media (min-width: 768px) {
            .title { font-size: 36px; }
            .script-line { font-size: 22px; }
            .number-btn { padding: 18px 28px; font-size: 20px; }
            .control-btn { padding: 16px 24px; font-size: 20px; }
        }
    </style>
</head>
<body>
    <h1 class="title">🎭 阿瓦隆 · 神之眼</h1>
    <div class="container">
        <div class="number-select">
            <p>👥 选择游戏人数</p>
            <button class="number-btn" data-number="5">5人局</button>
            <button class="number-btn" data-number="7">7人局</button>
            <button class="number-btn" data-number="8">8人局</button>
            <button class="number-btn" data-number="10">10人局</button>
        </div>

        <div class="control-area" style="display: none;">
            <div style="margin-bottom: 8px;">
                <span class="status-badge" id="progressBadge">第1 / 7句</span>
            </div>
            <div>
                <button class="control-btn" id="prevBtn">⏮ 上一句</button>
                <button class="control-btn" id="playBtn">▶ 播放</button>
                <button class="control-btn" id="nextBtn">⏭ 下一句</button>
            </div>
            <div style="margin-top: 16px;">
                <button class="control-btn" id="restartBtn">🔄 从头开始</button>
            </div>
            <div class="audio-status" id="audioStatus">🎵 音频系统就绪</div>
        </div>

        <div class="script-area" id="scriptArea">
            <p class="script-line">✨ 请先选择游戏人数，台词将自动加载</p>
        </div>

        <div class="footer">
            <p>📱 适配手机/平板 · 键盘左右键切换 · 空格键播放/暂停</p>
        </div>
    </div>

    <script>
        (function() {
            // ---------- DOM 元素 ----------
            const numberBtns = document.querySelectorAll('.number-btn');
            const controlArea = document.querySelector('.control-area');
            const scriptArea = document.getElementById('scriptArea');
            const prevBtn = document.getElementById('prevBtn');
            const playBtn = document.getElementById('playBtn');
            const nextBtn = document.getElementById('nextBtn');
            const restartBtn = document.getElementById('restartBtn');
            const progressBadge = document.getElementById('progressBadge');
            const audioStatus = document.getElementById('audioStatus');

            // ---------- 全局变量 ----------
            let currentScript = [];          // 当前人数的台词数组
            let currentIndex = 0;            // 当前播放索引
            let currentNumber = 5;           // 当前选中的人数（默认5，实际选择后会更新）
            let audio = new Audio();         // 全局音频对象
            let isPlaying = false;           // 播放状态

            // ---------- 台词库（与你的音频内容严格对应）----------
            const scripts = {
                5: [
                    "🌙 各位玩家，身份卡牌已分发，请确认身份，游戏即将开始。",
                    "📜 本局为5人标准局",
                    "😴 现在，请所有玩家闭眼。",
                    "👹 请莫甘娜、刺客睁眼，互认同伴身份。",
                    "🧙 请梅林睁眼，莫甘娜、刺客竖起拇指。",
                    "🛡️ 请派西维尔睁眼，莫甘娜、梅林竖起拇指。",
                    "☀️ 所有人调整表情，3、2、1，睁眼。"
                ],
                7: [
                    "🌙 各位玩家，身份卡牌已分发，请确认身份，游戏即将开始。",
                    "📜 本局为7人标准局",
                    "😴 现在，请所有玩家闭眼。",
                    "👹 请莫甘娜、刺客睁眼，互认同伴身份。",
                    "🧙 请梅林睁眼，莫甘娜、刺客、奥伯伦竖起拇指。",
                    "🛡️ 请派西维尔睁眼，莫甘娜、梅林竖起拇指。",
                    "☀️ 所有人调整表情，3、2、1，睁眼。"
                ],
                8: [
                    "🌙 各位玩家，身份卡牌已分发，请确认身份，游戏即将开始。",
                    "📜 本局为8人标准局",
                    "😴 现在，请所有玩家闭眼。",
                    "👹 请莫甘娜、刺客、莫德雷德睁眼，互认同伴身份。",
                    "🧙 请梅林睁眼，莫甘娜、刺客竖起拇指。",
                    "🛡️ 请派西维尔睁眼，莫甘娜、梅林竖起拇指。",
                    "☀️ 所有人调整表情，3、2、1，睁眼。"
                ],
                10: [
                    "🌙 各位玩家，身份卡牌已分发，请确认身份，游戏即将开始。",
                    "📜 本局为10人标准局",
                    "😴 现在，请所有玩家闭眼。",
                    "👹 请莫甘娜、刺客、莫德雷德睁眼，互认同伴身份。",
                    "🧙 请梅林睁眼，莫甘娜、刺客、奥伯伦竖起拇指。",
                    "🛡️ 请派西维尔睁眼，莫甘娜、梅林竖起拇指。",
                    "☀️ 所有人调整表情，3、2、1，睁眼。"
                ]
            };

            // ---------- 音频路径生成（严格按照 audio/人数/索引.mp3）----------
            function getAudioPath(number, index) {
                return `audio/${number}/${index}.mp3`;
            }

            // 预加载下一句音频（提升流畅度）
            function preloadNextAudio() {
                const nextIndex = currentIndex + 1;
                if (nextIndex < currentScript.length) {
                    const preAudio = new Audio();
                    preAudio.src = getAudioPath(currentNumber, nextIndex);
                }
            }

            // 停止当前音频并重置
            function stopAudio() {
                audio.pause();
                audio.currentTime = 0;
            }

            // 播放当前索引的音频
            function playCurrentAudio() {
                if (currentScript.length === 0) return;

                // 先停止之前可能正在播放的音频
                stopAudio();

                const path = getAudioPath(currentNumber, currentIndex);
                audio.src = path;

                // 播放
                audio.play().then(() => {
                    isPlaying = true;
                    playBtn.textContent = '⏸ 暂停';
                    audioStatus.textContent = '🔊 正在播报...';
                    preloadNextAudio(); // 预加载下一句
                }).catch(err => {
                    console.warn('音频播放失败:', err);
                    audioStatus.textContent = '⚠️ 音频加载失败，请检查文件是否存在';
                    isPlaying = false;
                    playBtn.textContent = '▶ 播放';
                });

                // 播放结束后的行为
                audio.onended = () => {
                    if (currentIndex < currentScript.length - 1) {
                        // 自动播放下一句
                        goToIndex(currentIndex + 1, true);
                    } else {
                        // 全部播完，回到开头但不自动播放
                        isPlaying = false;
                        playBtn.textContent = '▶ 播放';
                        audioStatus.textContent = '✅ 播报完毕';
                        currentIndex = 0;
                        renderScript();
                    }
                };

                audio.onerror = () => {
                    audioStatus.textContent = `❌ 音频文件缺失：audio/${currentNumber}/${currentIndex}.mp3`;
                    isPlaying = false;
                    playBtn.textContent = '▶ 播放';
                };
            }

            // 切换索引
            function goToIndex(newIndex, autoPlay = false) {
                if (currentScript.length === 0) return;
                
                // 边界循环处理
                currentIndex = (newIndex + currentScript.length) % currentScript.length;
                renderScript();

                if (autoPlay) {
                    playCurrentAudio();
                } else {
                    // 如果之前是播放状态，切换后继续播放新句（保持连贯）
                    if (isPlaying) {
                        playCurrentAudio();
                    } else {
                        // 暂停状态仅更新界面
                        playBtn.textContent = '▶ 播放';
                    }
                }
            }

            // 渲染台词区域
            function renderScript() {
                scriptArea.innerHTML = '';
                currentScript.forEach((line, index) => {
                    const div = document.createElement('div');
                    div.className = `script-line ${index === currentIndex ? 'current' : index < currentIndex ? 'past' : ''}`;
                    div.textContent = line;
                    scriptArea.appendChild(div);
                });
                // 自动滚动到当前高亮行
                const currentEl = document.querySelector('.script-line.current');
                if (currentEl) currentEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                updateProgress();
            }

            // 更新进度显示
            function updateProgress() {
                if (currentScript.length > 0) {
                    progressBadge.textContent = `第${currentIndex + 1} / ${currentScript.length}句`;
                }
            }

            // 重置为初始状态（切换人数时使用）
            function resetForNewNumber(number) {
                stopAudio();
                isPlaying = false;
                playBtn.textContent = '▶ 播放';
                currentNumber = number;
                currentScript = scripts[number] || [];
                currentIndex = 0;
                controlArea.style.display = 'block';
                renderScript();
                audioStatus.textContent = '🎵 音频就绪';
            }

            // ---------- 事件绑定 ----------

            // 1. 选择人数
            numberBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const num = parseInt(btn.dataset.number);
                    const confirmMsg = `确认切换到 ${num} 人局吗？当前进度将重置。`;
                    if (!confirm(confirmMsg)) return;

                    // 高亮处理
                    numberBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    resetForNewNumber(num);
                });
            });

            // 2. 播放 / 暂停
            playBtn.addEventListener('click', () => {
                if (currentScript.length === 0) {
                    alert('请先选择游戏人数');
                    return;
                }

                if (isPlaying) {
                    // 暂停
                    audio.pause();
                    isPlaying = false;
                    playBtn.textContent = '▶ 播放';
                    audioStatus.textContent = '⏸ 已暂停';
                } else {
                    // 播放
                    playCurrentAudio();
                }
            });

            // 3. 下一句
            nextBtn.addEventListener('click', () => {
                if (currentScript.length === 0) return;
                goToIndex(currentIndex + 1, isPlaying);
            });

            // 4. 上一句
            prevBtn.addEventListener('click', () => {
                if (currentScript.length === 0) return;
                goToIndex(currentIndex - 1, isPlaying);
            });

            // 5. 从头开始
            restartBtn.addEventListener('click', () => {
                if (currentScript.length === 0) return;
                stopAudio();
                currentIndex = 0;
                renderScript();
                if (isPlaying) {
                    playCurrentAudio();
                } else {
                    playBtn.textContent = '▶ 播放';
                    audioStatus.textContent = '🎵 已回到开头';
                }
            });

            // 6. 键盘快捷键（适合平板接键盘或电脑调试）
            window.addEventListener('keydown', (e) => {
                if (currentScript.length === 0) return;
                if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    goToIndex(currentIndex + 1, isPlaying);
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    goToIndex(currentIndex - 1, isPlaying);
                } else if (e.key === ' ') {
                    e.preventDefault();
                    playBtn.click();
                }
            });

            // 初始化显示
            renderScript();
        })();
    </script>
</body>
</html>
